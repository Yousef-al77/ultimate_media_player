name: ultimate_media_player
description: A complete media player and downloader application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # محرك تشغيل الفيديو لكافة الصيغ والترجمات
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_android_video: ^1.2.5

  # تشغيل الصوت بالخلفية
  just_audio: ^0.9.36
  just_audio_background: ^0.0.1-beta.11

  # التحكم بالسطوع والصوت بالإيماءات
  screen_brightness: ^2.0.0
  volume_controller: ^2.0.7

  # إدارة الملفات والترجمات واختيارها
  file_picker: ^8.0.0
  path_provider: ^2.1.3
  permission_handler: ^11.3.1

  # أدوات التحميل ومحرك يوتيوب
  dio: ^5.4.3+1
  youtube_explode_dart: ^2.2.1
  http: ^1.2.1

flutter:
  uses-material-design: true
