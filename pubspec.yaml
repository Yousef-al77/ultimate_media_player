name: ultimate_media_player
description: "A complete media player and downloader application"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  video_player: ^2.8.6
  chewie: ^1.8.1
  just_audio: ^0.9.36
  screen_brightness: ^0.2.2+1
  volume_controller: ^3.4.4
  file_picker: ^8.0.0
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  dio: ^5.4.3+1
  youtube_explode_dart: ^2.2.1
  http: ^1.2.1

flutter:
  uses-material-design: true
