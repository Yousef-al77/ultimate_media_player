name: ultimate_media_player
description: A complete media player and downloader application.
publish_to:  none 
version: 1.0.0+1

environment:
  sdk:  >=3.0.0 <4.0.0 

dependencies:
  flutter:
    sdk: flutter

  # تشغيل الفيديو بجميع الصيغ
  media_kit: ^1.1.11
  media_kit_video: ^2.0.1
  media_kit_libs_android_video: ^1.6.0

  # تشغيل الصوت
  just_audio: ^0.9.36

  # التحكم بالإيماءات متوافقة بدون تعارض
  screen_brightness: ^0.2.2+1
  volume_controller: ^3.4.4

  # إدارة الملفات والترجمات
  file_picker: ^8.0.0
  path_provider: ^2.1.3
  permission_handler: ^11.3.1

  # محركات التنزيل
  dio: ^5.4.3+1
  youtube_explode_dart: ^2.2.1
  http: ^1.2.1

flutter:
  uses-material-design: true
