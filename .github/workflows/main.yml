name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Latest Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Build Project from Scratch
        run: |
          # 1. إنشاء مشروع نظيف بأحدث بيئة
          flutter create ultimate_app
          
          # 2. نقل ملف الكود الأساسي الخاص بك
          cp lib/main.dart ultimate_app/lib/main.dart
          
          # 3. كتابة ملف المكتبات الصحيح والمتوافق تلقائياً من هنا
          cat << 'EOF' > ultimate_app/pubspec.yaml
          name: ultimate_app
          description: A complete media player and downloader application.
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: ">=3.0.0 <4.0.0"
          dependencies:
            flutter:
              sdk: flutter
            media_kit: ^1.1.11
            media_kit_video: ^1.2.4
            media_kit_libs_android_video: ^1.3.8
            just_audio: ^0.9.36
            screen_brightness: ^0.2.2+1
            volume_controller: ^3.4.4
            file_picker: ^8.0.0
            path_provider: ^2.1.3
            permission_handler: ^11.3.1
            dio: ^5.4.3+1
            youtube_explode_dart: ^2.2.1
            http: ^1.2.1
          dependency_overrides:
            package_info_plus: ^9.0.3
          flutter:
            uses-material-design: true
          EOF
          
          cd ultimate_app
          
          # 4. ترقية إعدادات الأندرويد للإصدارات الحديثة
          sed -i 's/flutter.compileSdkVersion/35/g' android/app/build.gradle
          sed -i 's/flutter.targetSdkVersion/35/g' android/app/build.gradle
          sed -i 's/flutter.minSdkVersion/21/g' android/app/build.gradle
          
          # 5. تنزيل الحزم وتجميع ملف الـ APK النهائي
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
          
          # 6. تجهيز التطبيق للتحميل
          mkdir -p ../output
          cp build/app/outputs/flutter-apk/app-release.apk ../output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ultimate-Media-App
          path: output/app-release.apk
