name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Build Project
        run: |
          flutter create --org com.example ultimate_app
          cp lib/main.dart ultimate_app/lib/main.dart
          cp pubspec.yaml ultimate_app/pubspec.yaml
          cd ultimate_app
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
          mkdir -p ../output
          cp build/app/outputs/flutter-apk/app-release.apk ../output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ultimate-Media-App
          path: output/app-release.apk
