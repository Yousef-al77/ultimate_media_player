name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution:  zulu 
          java-version:  17 

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version:  3.24.0 
          channel:  stable 

      - name: Create Base Project Skeleton
        run: |
          mkdir temp_app
          cd temp_app
          flutter create --org com.example ultimate_media_player
          sed -i  s|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.3-all.zip|  ultimate_media_player/android/gradle/wrapper/gradle-wrapper.properties
          cp -r ultimate_media_player/android ../
          cd ..
          rm -rf temp_app

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ultimate-Media-App
          path: build/app/outputs/flutter-apk/app-release.apk
