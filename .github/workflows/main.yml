name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Latest Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Build Project
        run: |
          flutter create ultimate_app
          cp lib/main.dart ultimate_app/lib/main.dart
          
          # استخدام كلمة any لترك النظام يحل التعارض تلقائياً ويجلب النسخ المتوافقة 100%
          cat << 'EOF' > ultimate_app/pubspec.yaml
          name: ultimate_app
          description: A complete media player.
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: ">=3.0.0 <4.0.0"
          dependencies:
            flutter:
              sdk: flutter
            media_kit: any
            media_kit_video: any
            media_kit_libs_android_video: any
            just_audio: any
            screen_brightness: any
            volume_controller: any
            file_picker: any
            path_provider: any
            permission_handler: any
            dio: any
            youtube_explode_dart: any
            http: any
          flutter:
            uses-material-design: true
          EOF
          
          cd ultimate_app
          
          echo "flutter.minSdkVersion=21" >> android/local.properties
          echo "flutter.compileSdkVersion=34" >> android/local.properties
          echo "flutter.targetSdkVersion=34" >> android/local.properties
          
          sed -i 's/flutter.minSdkVersion/21/g' android/app/build.gradle || true
          sed -i 's/flutter.compileSdkVersion/34/g' android/app/build.gradle || true
          sed -i 's/flutter.targetSdkVersion/34/g' android/app/build.gradle || true

          flutter pub get
          flutter build apk --release --no-tree-shake-icons
          
          mkdir -p ../output
          cp build/app/outputs/flutter-apk/app-release.apk ../output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ultimate-Media-App
          path: output/app-release.apk
