name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution:  zulu 
          java-version:  17 

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version:  3.24.3 
          channel:  stable 

      - name: Rebuild Fresh Android Skeleton
        run: |
          mkdir temp_build
          cd temp_build
          flutter create --org com.example ultimate_media_player
          rm -rf ../android
          cp -r ultimate_media_player/android ../
          cd ..
          rm -rf temp_build
          # رفع مستوى SDK ليطابق المتطلبات
          sed -i  s/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 35/  android/app/build.gradle || true
          sed -i  s/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 35/  android/app/build.gradle || true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ultimate-Media-App
          path: build/app/outputs/flutter-apk/app-release.apk
