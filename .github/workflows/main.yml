name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution:  zulu 
          java-version:  17 

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version:  3.19.6 
          channel:  stable 

      - name: Build and Package
        run: |
          # 1. إنشاء مشروع نظيف
          flutter create ultimate_app
          
          # 2. نقل ملفاتك إليه
          cp lib/main.dart ultimate_app/lib/main.dart
          cp pubspec.yaml ultimate_app/pubspec.yaml
          cd ultimate_app
          
          # 3. الطريقة الرسمية والآمنة لتحديد إصدارات الأندرويد بدون العبث في أكواد Gradle نهائياً
          echo "flutter.minSdkVersion=21" >> android/local.properties
          echo "flutter.compileSdkVersion=34" >> android/local.properties
          echo "flutter.targetSdkVersion=34" >> android/local.properties
          
          # 4. جلب المكتبات وتجميع التطبيق
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
          
          # 5. استخراج الـ APK النهائي
          mkdir -p ../output
          cp build/app/outputs/flutter-apk/app-release.apk ../output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ultimate-Media-App
          path: output/app-release.apk
